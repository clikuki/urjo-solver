<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Urjo Puzzle Solver</title>
	<link rel="stylesheet" href="style.css">
</head>

<body>
	<main>
		<div class="grid"></div>
		<div class="controls">
			<button id="step">STEP</button>
			<button id="solve">SOLVE</button>
		</div>
	</main>


	<template class="cell-template">
		<div class="cell" id="cell-#" data-state="UNSET">
			<div class="side side-A"></div>
			<div class="side side-B"></div>
			<span class="count"></span>
		</div>
	</template>

	<script type="module" src="/build/main.js" defer></script>
</body>

</html>
